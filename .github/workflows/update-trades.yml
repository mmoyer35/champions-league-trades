name: Update trade history & record book

on:
  schedule:
    # Tuesdays, 12:00 UTC (8am ET). Keep in sync with the 8-day staleness
    # warning the dashboard shows if a run gets skipped.
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record current counts
        id: before
        run: |
          echo "count=$(python -c "import json;print(json.load(open('trades.json'))['tradeCount'])")" >> "$GITHUB_OUTPUT"
          echo "games=$(python -c "import json,os;print(json.load(open('records.json'))['gameCount'] if os.path.exists('records.json') else 0)")" >> "$GITHUB_OUTPUT"

      - name: Rebuild from Sleeper
        run: |
          # No --allow-shrink: the script aborts rather than overwrite good
          # data if Sleeper returns a partial response. A red run here is the
          # signal; silent staleness is the thing we are trying to avoid.
          python ff_history.py --outdir .
          cp trade_timeline.html index.html

      - name: Rebuild the record book
        run: |
          # Same no-shrink contract as the trade history: a partial Sleeper
          # response aborts rather than overwriting a good records.json.
          python ff_analyze.py --outdir .

      - name: Commit any changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trades.json trade_timeline.html index.html records.json records.html
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update trade history and record book ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          AFTER=$(python -c "import json;print(json.load(open('trades.json'))['tradeCount'])")
          GAFTER=$(python -c "import json,os;print(json.load(open('records.json'))['gameCount'] if os.path.exists('records.json') else 0)")
          BEFORE=${{ steps.before.outputs.count }}
          GBEFORE=${{ steps.before.outputs.games }}
          {
            echo "### Trade history & record book refresh"
            echo ""
            echo "| | Before | After | New |"
            echo "|---|---|---|---|"
            echo "| Trades | $BEFORE | $AFTER | $((AFTER - BEFORE)) |"
            echo "| Games | $GBEFORE | $GAFTER | $((GAFTER - GBEFORE)) |"
            echo ""
            echo "Committed: ${{ steps.commit.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
